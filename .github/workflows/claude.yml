# Lets collaborators ask Claude for changes in plain language: mention @claude in
# an issue or a PR comment and it works on a branch, then replies with a link to
# open the PR (or pushes to the PR it was mentioned on). Nothing reaches main
# without a reviewed merge.
#
# Only users with write access to the repo can trigger it (enforced by the action).
#
# Needs one repository secret:
#   CLAUDE_CODE_OAUTH_TOKEN - from `claude setup-token`; runs count against that
#                             Claude subscription's usage limits
# and the Claude GitHub App installed on the repo (github.com/apps/claude).
#
# Deliberately gets no Supabase or Vercel secrets: database changes stay with a
# human, via `npm run db:push` from main (see CLAUDE.md).
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # Bounds how much subscription usage one runaway request can burn.
    timeout-minutes: 30
    # One run per issue/PR at a time, so a follow-up comment can't race the first.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # So Claude can run lint, typecheck and tests before pushing.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # next-env.d.ts (image imports, route types) is gitignored; without it
      # `tsc --noEmit` fails on a clean checkout.
      - run: npx next typegen

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(npm run lint:*),Bash(npm test:*),Bash(node --import tsx --test:*),Bash(npx tsc --noEmit:*)"
            --append-system-prompt "The person asking may not be technical. Reply in plain language: describe what changed as they would see it in the app, not in terms of code, and tell them they can check the change on the Vercel preview link once the PR is open. If a request is ambiguous, ask one short clarifying question instead of guessing. Before pushing, run npm run lint, npx tsc --noEmit and npm test, and fix what they report. Never create or edit files under supabase/ and never change the database schema or RLS policies: if a request needs a database change, explain that it needs the repo owner and stop."
